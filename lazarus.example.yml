# Lazarus config — each target is one backup you want proven restorable.
#
# Copy to lazarus.yml and adjust. Run with:
#   lazarus --config lazarus.yml

# Where Lazarus remembers each target's last known-good backup size, so it
# can tell a real drift from noise across separate cron runs. Defaults to
# lazarus-state.json next to wherever the tool runs from; safe to delete —
# the next run just re-establishes baselines from scratch.
state_file: lazarus-state.json

# How many targets to verify at once. Each one's restore is already fully
# isolated (its own sandbox container, or its own throwaway file for
# SQLite), so there's nothing to serialize on. Defaults to 4; set to 1 to
# verify targets one at a time instead.
parallelism: 4

# Where to report a run's outcome. Without this, a 4am cron run that finds a
# broken backup only says so through its exit code — and nobody reads that.
notify:
  # Leave empty to disable. Better: set LAZARUS_WEBHOOK_URL in the
  # environment instead, so the URL never has to live in a file.
  webhook_url: ""

  # Optional bearer token for webhook authentication (or set LAZARUS_API_KEY).
  api_key: ""

  # slack (default) | discord | telegram | teams | generic | lazarus | pagerduty | email
  format: slack

  # on_failure (default) | always | never
  #
  # "always" is worth considering: if Lazarus itself stops running — cron
  # broken, machine down — silence looks exactly like healthy backups. A
  # message on every run turns that silence into a signal.
  when: on_failure

  # Native SMTP HTML Email report (active when format: email)
  # smtp:
  #   host: smtp.mailgun.org
  #   port: 587
  #   username: postmaster@mg.example.com
  #   password: secret_password
  #   from: lazarus-alerts@example.com
  #   to:
  #     - dba-oncall@example.com
  #     - reliability-team@example.com

  # Optional Control Plane URL for link buttons in Slack and Teams alerts.
  # When set, notification messages will include a "View Dashboard" button.
  # dashboard_url: "https://control-plane.internal:8080"

targets:
  - name: production-postgres
    engine: postgres

    # Target tags for multi-environment grouping & Control Plane filtering
    tags: [prod, aws, postgres]

    # Periodic verification interval when running in daemon mode (--daemon)
    interval: 2h

    # Option A: Native S3 / Cloudflare R2 / MinIO pull (No aws-cli needed!)
    # s3:
    #   bucket: my-backups
    #   key: postgres/shop-latest.sql.gz
    #   region: us-east-1                  # default: us-east-1
    #   endpoint: ""                       # e.g. https://<account>.r2.cloudflarestorage.com or http://minio:9000
    #   access_key_id: ""                  # optional, falls back to AWS_ACCESS_KEY_ID env
    #   secret_access_key: ""              # optional, falls back to AWS_SECRET_ACCESS_KEY env
    #
    # Option B: Native Google Cloud Storage (GCS) pull (No gcloud CLI needed!)
    # gcs:
    #   bucket: my-company-backups
    #   object: postgres/shop-latest.sql.gz
    #   credentials_json: ""               # optional, falls back to GOOGLE_APPLICATION_CREDENTIALS env
    #
    # Option C: Native Azure Blob Storage pull (No az CLI needed!)
    # azure:
    #   account_name: mybackupstorage
    #   container: postgres-backups
    #   blob: shop-latest.sql.gz
    #   account_key: ""                    # optional, falls back to AZURE_STORAGE_KEY env
    #
    # Option D: Shell fetch command (aws s3 cp, rclone, scp, ...)
    # fetch_command: aws s3 cp s3://my-backups/postgres/shop-latest.sql.gz /backups/postgres/shop-latest.sql.gz
    # fetch_timeout: 5m   # defaults to 5m when fetch_command is set

    # Plain path or a glob. With a glob, the most recently modified match is
    # used — that's the file you'd actually restore in an emergency. A
    # .gpg/.pgp/.asc suffix (e.g. shop-latest.sql.gz.gpg) is decrypted
    # automatically — see LAZARUS_GPG_PASSPHRASE and "GPG 加密備份" in the
    # README. Nothing to set here for that; it's detected from the name.
    path: /backups/postgres/shop-*.sql.gz

    # Automatically delete the downloaded backup file at path after verification
    # finishes to reclaim disk space (ideal for remote/S3 pulled backups).
    # NOTE: cleanup_backup cannot be combined with wildcard/glob patterns (*?[)
    # to prevent deleting rolling archives, and requires an exact file path.
    # cleanup_backup: true

    # Fail if the newest backup is older than this. A backup that restores
    # perfectly but is three weeks old is still a failed backup.
    max_age: 26h

    # Fail if the restore step alone takes longer than this. A backup that
    # restores correctly but takes 6 hours is still a failed backup if your
    # service can only tolerate an hour of downtime — this is how most teams
    # find out their real recovery time, since it's otherwise measured for
    # the first time during an actual incident. Omit for no limit; the
    # duration is reported either way.
    max_restore_duration: 2h

    # Enterprise SLA Recovery Time Objective (RTO) target. Tracked in Control Plane
    # dashboard and compliance audit certificate generation.
    sla_rto: 30m

    # Fail if the newest backup is more than this much smaller than the last
    # backup that fully passed verification. Catches a silently shrinking
    # export (a filter added upstream, a truncated dump) even when every
    # check below still passes against whatever data is left. Omit to skip
    # this check; a target's first-ever run always just establishes the
    # baseline rather than failing.
    size_drift:
      max_decrease_pct: 50

    # Sandbox image. Match your production major version — a dump from
    # Postgres 16 won't restore into 14.
    image: postgres:16-alpine

    # Sandbox Security Hardening:
    # network: none isolates sandbox from internet (blocks SQL-injection SSRF or exfiltration)
    # read_only_rootfs: true mounts container root as read-only
    # network: none
    # read_only_rootfs: true

    # Pre/Post Drill Lifecycle Hooks:
    # Environment variables injected: $LAZARUS_TARGET, $LAZARUS_ENGINE, $LAZARUS_STATUS,
    # $LAZARUS_STAGE, $LAZARUS_DURATION_MS, $LAZARUS_RESTORE_DURATION_MS, etc.
    # pre_drill_command: "echo 'Drill started for $LAZARUS_TARGET'"
    # post_drill_command: "echo 'Drill finished: $LAZARUS_STATUS (took $LAZARUS_RESTORE_DURATION_MS ms)'"
    # hooks_timeout: 30s

    # Fallback Disaster Recovery Drill & Real RPO Analysis:
    # When enabled, if the newest backup fails, Lazarus automatically attempts
    # previous backup files up to max_fallback_depth and calculates true achievable RPO.
    fallback_on_failure: true
    max_fallback_depth: 3

    # Automated Schema & Table Drift Inspection:
    # Introspects table counts and verifies expected tables exist after restore.
    auto_schema_check: true
    schema_baseline: [users, orders, schema_migrations]

    # The restore "succeeding" isn't enough: a schema-only dump restores
    # fine and leaves you with an empty database. These assertions are what
    # prove the backup carries real data.
    checks:
      - name: users table is populated
        sql: SELECT count(*) FROM users
        expect_min: 1

      - name: orders from the last week made it in
        sql: SELECT count(*) FROM orders WHERE created_at > now() - interval '7 days'
        expect_min: 1

      - name: no half-migrated schema
        sql: SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'
        expect_min: 10

      # Positive Regex Assertion: verify release version tag conforms to semver
      - name: schema version format is valid
        sql: SELECT version FROM schema_migrations ORDER BY version DESC LIMIT 1
        expect_pattern: "^v?\\d+\\.\\d+\\.\\d+"

      # Data Sanitization & Leakage Guard: ensure staging/analytics backups don't leak unmasked emails
      - name: customer emails are properly masked
        sql: SELECT email FROM customers WHERE email LIKE '%@gmail.com' LIMIT 1
        expect_not_pattern: "[a-zA-Z0-9._%+-]+@gmail\\.com"

  - name: production-mysql
    engine: mysql
    path: /backups/mysql/app-latest.sql
    max_age: 26h
    image: mysql:8
    checks:
      - name: customers table is populated
        sql: SELECT count(*) FROM customers
        expect_min: 1

  - name: local-sqlite
    engine: sqlite

    # A SQLite backup is a full copy of the .db file itself (optionally
    # gzipped), not a SQL dump — there's no server to import a dump into.
    path: /backups/sqlite/app-*.db

    # No sandbox container and no `image` — the backup file already is the
    # database. "Restoring" it is just copying it somewhere disposable and
    # running SQLite's own integrity check on the copy.
    checks:
      - name: users table is populated
        sql: SELECT count(*) FROM users
        expect_min: 1

  - name: cache-redis
    engine: redis
    path: /backups/redis/dump-*.rdb
    max_age: 26h
    checks:
      - name: database has keys
        command: DBSIZE
        expect_min: 1

  - name: document-mongodb
    engine: mongodb
    path: /backups/mongo/dump-*.archive.gz
    max_age: 26h
    # Optional resource quotas for sandbox container:
    # memory_limit: 2g
    # cpus: "1.5"
    checks:
      - name: users collection is populated
        command: db.users.countDocuments()
        expect_min: 1
