apiVersion: apps/v1
kind: Deployment
metadata:
  name: lazarus-server
  labels:
    app.kubernetes.io/name: lazarus-server
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lazarus-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lazarus-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: lazarus-server
          image: ghcr.io/qscgy5713/lazarus-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-addr"
            - ":8080"
            - "-state"
            - "/data/lazarus-server.json"
            - "-overdue"
            - "26h"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lazarus-secret
                  key: api-key
                  optional: true
            - name: ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: lazarus-secret
                  key: alert-webhook-url
                  optional: true
            - name: ALERT_FORMAT
              value: "slack"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lazarus-server-pvc
