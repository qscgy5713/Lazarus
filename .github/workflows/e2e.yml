name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Real backups, cloud emulators, control plane & worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CLI prerequisites
        run: sudo apt-get update && sudo apt-get install -y sqlite3 age

      - name: Pre-pull images
        run: |
          for img in postgres:16-alpine mysql:8 redis:7-alpine mongo:7.0 \
                     versity/versitygw fsouza/fake-gcs-server \
                     mcr.microsoft.com/azure-storage/azurite; do
            docker pull -q "$img" &
          done
          wait

      - name: Run E2E suite
        run: ./test/e2e/run.sh
