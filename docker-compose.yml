# Runs Lazarus itself in a container. It still needs to talk to a real
# Docker daemon to start each target's sandbox — that's what the socket
# mount below is for; the sandbox containers it starts run as siblings on
# the *host's* daemon, not nested inside this one.
#
# Compose has no built-in scheduler, so this alone doesn't run Lazarus
# periodically — pair it with a host cron entry (see "排進 cron" in the
# README) calling:
#   docker compose run --rm lazarus
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: lazarus-server
    ports:
      - "8080:8080"
    environment:
      - SERVER_API_KEY
      - OVERDUE_THRESHOLD=26h
    volumes:
      - lazarus-server-data:/data
    restart: unless-stopped

  lazarus:
    build: .
    volumes:
      # Your real config and backup directory — adjust the host paths.
      - ./lazarus.yml:/etc/lazarus/lazarus.yml:ro
      - /path/to/backups:/backups:ro
      # Keeps size-drift baselines across separate `run --rm` invocations,
      # since --rm throws away the container (and anything written to its
      # own filesystem) every time.
      - lazarus-state:/var/lib/lazarus
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LAZARUS_WEBHOOK_URL
      - LAZARUS_API_KEY
      - LAZARUS_GPG_PASSPHRASE

volumes:
  lazarus-server-data:
  lazarus-state:
